name: Deploy Landing Page to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

# Permissões necessárias para publicar no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite apenas um deploy ativo por vez
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      # URLs públicas do backend e do painel: Settings → Secrets and variables → Actions → Variables
      - name: Verificar URLs de produção
        run: |
          if [ -z "${{ vars.LANDING_API_URL }}" ]; then
            echo "::warning::Variável LANDING_API_URL não definida: agendamento e validação de documentos ficarão indisponíveis na landing page."
          fi
          if [ -z "${{ vars.LANDING_APP_URL }}" ]; then
            echo "::warning::Variável LANDING_APP_URL não definida: os links para o painel (entrar, buscar psicólogo) ficarão ocultos."
          fi

      - name: Compilar projeto (Vite build)
        run: bun run build:landing
        env:
          VITE_API_URL: ${{ vars.LANDING_API_URL }}
          VITE_APP_URL: ${{ vars.LANDING_APP_URL }}

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload dos arquivos compilados (dist)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './apps/landingpage/dist'

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
